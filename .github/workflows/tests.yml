name: Automated project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r python/requirements.txt
      - run: python -B -m pytest python/tests -q --junitxml=python/test-results/junit.xml
      - run: npm ci
        working-directory: web
      - run: npm run test:report
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            python/test-results/
            web/test-results/
